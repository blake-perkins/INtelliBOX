server {
    server_name intellibox-pilot.duckdns.org;

    # Health endpoint — no auth (CI health checks)
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else — require login
    location / {
        auth_basic "INtelliBOX";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/intellibox-pilot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intellibox-pilot.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = intellibox-pilot.duckdns.org) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name intellibox-pilot.duckdns.org;
    return 404;
}
