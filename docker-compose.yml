version: '3.8'

services:
  intellibox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellibox
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Testing profile: run the web app with test config
  intellibox-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellibox-test
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=sqlite:///./data/intellibox.db
      - TESTING=true
    volumes:
      - ./data/test:/app/data
    ports:
      - "8001:8000"
    profiles:
      - testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

  # Test runner: runs the full test suite and exits
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: intellibox-test-runner
    env_file:
      - .env.test
    profiles:
      - ci

  # Optional: PostgreSQL for production-like setup
  postgres:
    image: postgres:16-alpine
    container_name: intellibox-db
    environment:
      - POSTGRES_DB=intellibox
      - POSTGRES_USER=intellibox
      - POSTGRES_PASSWORD=changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
