version: '3.8'

services:
  emailtools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailtools
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # CMD from Dockerfile: emailtools web --host 0.0.0.0 --port 8000

  # Testing profile: isolated DB via volume mount, TESTING=true enables /api/test/reset
  emailtools-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailtools-test
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=sqlite:///./data/emailtools.db
      - TESTING=true
    volumes:
      - ./data/test:/app/data
    ports:
      - "8001:8000"
    profiles:
      - testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

  # Optional: PostgreSQL for production-like setup
  postgres:
    image: postgres:16-alpine
    container_name: emailtools-db
    environment:
      - POSTGRES_DB=emailtools
      - POSTGRES_USER=emailtools
      - POSTGRES_PASSWORD=changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
