[project]
name = "intellibox"
version = "0.1.0"
description = "Email action tracking system for fast-paced teams"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.10.0",
    "jinja2>=3.1.3",
    "click>=8.1.7",
    "apscheduler>=3.10.4",
    "tabulate>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "extract-msg>=0.45.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.4.0",
    "psycopg[binary]>=3.1.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.13",
    "behave>=1.2.6",
    "requests>=2.31.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.40.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.7",
]

[project.scripts]
intellibox = "intellibox.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E402",   # module-import-not-at-top (used intentionally in tests/steps)
    "E501",   # line-too-long (handled by formatter, not linter)
    "E711",   # none-comparison (SQLAlchemy uses == None)
    "E712",   # true-false-comparison (SQLAlchemy uses == True)
    "E722",   # bare-except (acceptable in resilience code)
    "E702",   # multiple-statements-on-one-line
    "F841",   # unused-variable (acceptable in tests)
    "N806",   # non-lowercase-variable-in-function
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"features/steps/*.py" = ["F401", "F811"]
"tests/e2e/*.py" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/intellibox --cov-report=term-missing"
markers = [
    "e2e: End-to-end browser tests (Playwright)",
    "smoke: Smoke tests against the live pilot server",
    "pg: PostgreSQL-specific tests (requires running PG instance)",
    "sqlite_only: Tests that only apply to SQLite backend",
    "stress: High-throughput stress tests (slow)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]
