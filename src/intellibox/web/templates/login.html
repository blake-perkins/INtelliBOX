<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — INtelliBOX</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header img {
            height: 48px;
            margin-bottom: 0.75rem;
        }
        .login-header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 600;
        }
        .login-header p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .error-msg {
            background: #fee;
            color: #a93226;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div style="background: #2c3e50; border-radius: 8px; padding: 0.5rem 1.5rem; display: inline-block; margin-bottom: 0.75rem;">
                <img src="/static/logo.png" alt="INtelliBOX" style="margin-bottom: 0;">
            </div>
            <h1>Sign in to INtelliBOX</h1>
            <p>{% if auth_mode == "oidc" %}Use your organization account to continue{% else %}Enter your credentials to continue{% endif %}</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        {% if auth_mode == "oidc" %}
        <a href="/auth/oidc/login?next={{ next }}" class="btn-login"
           style="display: block; text-align: center; text-decoration: none; line-height: 1.5;">
            Sign in with SSO
        </a>
        {% else %}
        <form method="post" action="/auth/login">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
