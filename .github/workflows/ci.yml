name: CI

on:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: python run_tests.py
      - name: pip-audit (dependency CVEs)
        run: pip-audit --desc --skip-editable
      - name: bandit (static security analysis)
        run: bandit -r src/intellibox/ -c .bandit.yml -f json -o bandit-report.json || true
      - name: bandit gate (fail on high severity)
        run: bandit -r src/intellibox/ -c .bandit.yml --severity-level high --confidence-level high
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to IronBank registry
        run: echo "${{ secrets.IRONBANK_PASSWORD }}" | docker login registry1.dso.mil -u "${{ secrets.IRONBANK_USER }}" --password-stdin
      - name: Build production image
        run: docker build -t intellibox:prod .
      - name: Build test runner image
        run: |
          cp .dockerignore .dockerignore.bak
          cp .dockerignore.test .dockerignore
          docker build -f Dockerfile.test -t intellibox:test-runner .
          cp .dockerignore.bak .dockerignore
      - name: Run unit tests inside container
        run: >
          docker run --rm
          -e DATABASE_URL=$DATABASE_URL
          -e OPENAI_API_KEY=$OPENAI_API_KEY
          -e OPENAI_MODEL=$OPENAI_MODEL
          -e SMTP_HOST=$SMTP_HOST
          -e SMTP_PORT=$SMTP_PORT
          -e SMTP_USER=$SMTP_USER
          -e SMTP_PASSWORD=$SMTP_PASSWORD
          -e REPORT_FROM=$REPORT_FROM
          -e REPORT_RECIPIENTS=$REPORT_RECIPIENTS
          -e TESTING=$TESTING
          intellibox:test-runner
      - name: Start production container
        run: |
          mkdir -p data/inbox data/emails
          docker run -d --name intellibox -p 8000:8000 \
            -e DATABASE_URL=$DATABASE_URL \
            -e OPENAI_API_KEY=$OPENAI_API_KEY \
            -e OPENAI_MODEL=$OPENAI_MODEL \
            -e SMTP_HOST=$SMTP_HOST \
            -e SMTP_PORT=$SMTP_PORT \
            -e SMTP_USER=$SMTP_USER \
            -e SMTP_PASSWORD=$SMTP_PASSWORD \
            -e REPORT_FROM=$REPORT_FROM \
            -e REPORT_RECIPIENTS=$REPORT_RECIPIENTS \
            -e TESTING=$TESTING \
            intellibox:prod
      - name: Wait for container health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start"
          docker logs intellibox
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BDD test dependencies
        run: pip install -e ".[dev]"
      - name: Run BDD tests against live container
        env:
          TEST_BASE_URL: http://localhost:8000
        run: behave features/ --no-capture
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM files
        run: syft intellibox:prod -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
      - name: Install Grype
        uses: anchore/scan-action/download-grype@v4
      - name: Grype vulnerability scan
        run: grype sbom:sbom.spdx.json --fail-on high --only-fixed -c .grype.yaml
      - name: Show container logs on failure
        if: failure()
        run: docker logs intellibox

  deploy:
    needs: [lint, test, container]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.PILOT_SSH_KEY }}" ] || [ -z "${{ secrets.PILOT_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: PILOT_SSH_KEY or PILOT_HOST secret not configured"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PILOT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.PILOT_HOST }}
          IRONBANK_USER: ${{ secrets.IRONBANK_USER }}
          IRONBANK_PASSWORD: ${{ secrets.IRONBANK_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i ~/.ssh/deploy_key \
              "ubuntu@${SSH_HOST}" \
              "export IRONBANK_USER='${IRONBANK_USER}'; export IRONBANK_PASSWORD='${IRONBANK_PASSWORD}'; bash -s" << 'DEPLOY_SCRIPT'
          set -euo pipefail

          echo "=== Quick deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

          cd /home/ubuntu/INtelliBOX
          git fetch origin main
          git reset --hard origin/main
          echo "HEAD: $(git rev-parse --short HEAD) — $(git log -1 --format='%s')"

          # Stop systemd service and disable to prevent auto-restart
          sudo systemctl disable --now intellibox.service 2>/dev/null || true

          # Stop and remove all intellibox containers
          sudo podman stop -a --time 10 2>/dev/null || true
          sudo podman rm -af 2>/dev/null || true

          # Debug: show what's on port 8000
          echo "=== Port 8000 status ==="
          sudo ss -tlnp | grep ':8000 ' || echo "Port 8000 is free."

          # Nuclear option: kill anything on port 8000
          sudo fuser -k 8000/tcp 2>/dev/null || true
          sleep 2

          # Verify port is free
          if sudo ss -tlnp | grep -q ':8000 '; then
              echo "ERROR: Port 8000 still in use after cleanup!"
              sudo ss -tlnp | grep ':8000 '
              exit 1
          fi
          echo "Port 8000 confirmed free."

          echo "=== Logging in to IronBank registry ==="
          echo "$IRONBANK_PASSWORD" | sudo podman login registry1.dso.mil -u "$IRONBANK_USER" --password-stdin

          echo "=== Building container image ==="
          sudo podman build -t intellibox:prod -f Dockerfile .

          echo "=== Starting container ==="
          sudo podman run -d \
              --name intellibox \
              --restart=always \
              --env-file /home/ubuntu/INtelliBOX/deploy/.env.production \
              -v /opt/intellibox/data:/app/data:Z \
              -p 127.0.0.1:8000:8000 \
              intellibox:prod

          echo "=== Waiting for health check ==="
          for i in $(seq 1 30); do
              if curl -sf --max-time 3 http://127.0.0.1:8000/health; then
                  echo ""
                  echo "Healthy after ${i}s"
                  curl -s http://127.0.0.1:8000/health
                  echo ""
                  sudo podman generate systemd --name intellibox --new | sudo tee /etc/systemd/system/intellibox.service > /dev/null
                  sudo systemctl daemon-reload
                  sudo systemctl enable intellibox.service
                  exit 0
              fi
              sleep 1
          done
          echo "Health check failed after 30s"
          sudo podman logs --tail 30 intellibox
          exit 1
          DEPLOY_SCRIPT

      - name: Verify external endpoint
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.PILOT_HOST }}
        run: |
          sleep 5
          curl -sf --max-time 10 "https://${SSH_HOST}/health" && echo "External check passed" || echo "::warning::External check failed — verify manually"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
