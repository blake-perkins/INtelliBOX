name: CI

on:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4-turbo-preview
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: python run_tests.py

  container-build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t intellibox:prod .
      - name: Build test runner image
        run: |
          cp .dockerignore .dockerignore.bak
          cp .dockerignore.test .dockerignore
          docker build -f Dockerfile.test -t intellibox:test-runner .
          cp .dockerignore.bak .dockerignore
      - name: Run tests inside container
        run: >
          docker run --rm
          -e DATABASE_URL=sqlite:///./data/intellibox.db
          -e OPENAI_API_KEY=sk-test-dummy-key
          -e OPENAI_MODEL=gpt-4-turbo-preview
          -e SMTP_HOST=smtp.test.invalid
          -e SMTP_PORT=587
          -e SMTP_USER=test@test.invalid
          -e SMTP_PASSWORD=test-password
          -e REPORT_FROM=test@test.invalid
          -e REPORT_RECIPIENTS=test@test.invalid
          -e TESTING=true
          intellibox:test-runner

  container-integration:
    needs: container-build-and-test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4-turbo-preview
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t intellibox:prod .
      - name: Start production container
        run: |
          mkdir -p data/inbox data/emails
          docker run -d --name intellibox -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./data/intellibox.db \
            -e OPENAI_API_KEY=sk-test-dummy-key \
            -e OPENAI_MODEL=gpt-4-turbo-preview \
            -e SMTP_HOST=smtp.test.invalid \
            -e SMTP_PORT=587 \
            -e SMTP_USER=test@test.invalid \
            -e SMTP_PASSWORD=test-password \
            -e REPORT_FROM=test@test.invalid \
            -e REPORT_RECIPIENTS=test@test.invalid \
            -e TESTING=true \
            intellibox:prod
      - name: Wait for container health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start"
          docker logs intellibox
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and BDD test dependencies
        run: pip install -e ".[dev]"
      - name: Run BDD tests against live container
        env:
          TEST_BASE_URL: http://localhost:8000
        run: behave features/ --no-capture
      - name: Show container logs on failure
        if: failure()
        run: docker logs intellibox

  deploy:
    needs: [test, container-build-and-test, container-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          PILOT_HOST: ${{ secrets.PILOT_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$PILOT_HOST" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "Skipping deploy: PILOT_HOST or DEPLOY_TOKEN secret not configured"
            exit 0
          fi
          RESPONSE=$(curl -sf --max-time 30 \
            -X POST "https://$PILOT_HOST/api/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN")
          echo "Deploy triggered: $RESPONSE"
      - name: Wait for rebuild and verify
        env:
          PILOT_HOST: ${{ secrets.PILOT_HOST }}
        run: |
          if [ -z "$PILOT_HOST" ]; then
            echo "Skipping verify: PILOT_HOST secret not configured"
            exit 0
          fi
          echo "Waiting 60s for container rebuild..."
          sleep 60
          for i in $(seq 1 36); do
            if curl -sf --max-time 5 "https://$PILOT_HOST/health"; then
              echo ""
              echo "Pilot healthy after $((60 + i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Pilot failed health check after 240s"
          exit 1
