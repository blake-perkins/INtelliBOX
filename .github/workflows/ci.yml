name: CI

on:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: python run_tests.py --full
      - name: pip-audit (dependency CVEs)
        run: pip-audit --desc --skip-editable
      - name: bandit (static security analysis)
        run: bandit -r src/intellibox/ -c .bandit.yml -f json -o bandit-report.json || true
      - name: bandit gate (fail on high severity)
        run: bandit -r src/intellibox/ -c .bandit.yml --severity-level high --confidence-level high
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to IronBank registry
        run: echo "${{ secrets.IRONBANK_PASSWORD }}" | docker login registry1.dso.mil -u "${{ secrets.IRONBANK_USER }}" --password-stdin
      - name: Build production image
        run: docker build -t intellibox:prod .
      - name: Build test runner image
        run: |
          cp .dockerignore .dockerignore.bak
          cp .dockerignore.test .dockerignore
          docker build -f Dockerfile.test -t intellibox:test-runner .
          cp .dockerignore.bak .dockerignore
      - name: Run unit tests inside container
        run: >
          docker run --rm
          -e DATABASE_URL=$DATABASE_URL
          -e OPENAI_API_KEY=$OPENAI_API_KEY
          -e OPENAI_MODEL=$OPENAI_MODEL
          -e SMTP_HOST=$SMTP_HOST
          -e SMTP_PORT=$SMTP_PORT
          -e SMTP_USER=$SMTP_USER
          -e SMTP_PASSWORD=$SMTP_PASSWORD
          -e REPORT_FROM=$REPORT_FROM
          -e REPORT_RECIPIENTS=$REPORT_RECIPIENTS
          -e TESTING=$TESTING
          intellibox:test-runner
      - name: Start production container
        run: |
          mkdir -p data/inbox data/emails
          docker run -d --name intellibox -p 8000:8000 \
            -e DATABASE_URL=$DATABASE_URL \
            -e OPENAI_API_KEY=$OPENAI_API_KEY \
            -e OPENAI_MODEL=$OPENAI_MODEL \
            -e SMTP_HOST=$SMTP_HOST \
            -e SMTP_PORT=$SMTP_PORT \
            -e SMTP_USER=$SMTP_USER \
            -e SMTP_PASSWORD=$SMTP_PASSWORD \
            -e REPORT_FROM=$REPORT_FROM \
            -e REPORT_RECIPIENTS=$REPORT_RECIPIENTS \
            -e TESTING=$TESTING \
            intellibox:prod
      - name: Wait for container health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to start"
          docker logs intellibox
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BDD test dependencies
        run: pip install -e ".[dev]"
      - name: Run BDD tests against live container
        env:
          TEST_BASE_URL: http://localhost:8000
        run: behave features/ --no-capture
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SBOM files
        run: syft intellibox:prod -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
      - name: Install Grype
        uses: anchore/scan-action/download-grype@v4
      - name: Grype vulnerability scan
        run: grype sbom:sbom.spdx.json --fail-on high --only-fixed -c .grype.yaml
      - name: Show container logs on failure
        if: failure()
        run: docker logs intellibox

  test-postgres:
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intellibox_test
          POSTGRES_USER: intellibox_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U intellibox_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run PostgreSQL test suite
        env:
          PG_TEST_DATABASE_URL: postgresql+psycopg://intellibox_test:test_password@localhost:5433/intellibox_test
        run: python run_pg_tests.py

  stress-postgres:
    needs: test-postgres
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/intellibox.db
      OPENAI_API_KEY: sk-test-dummy-key
      OPENAI_MODEL: gpt-4o-mini
      SMTP_HOST: smtp.test.invalid
      SMTP_PORT: '587'
      SMTP_USER: test@test.invalid
      SMTP_PASSWORD: test-password
      REPORT_FROM: test@test.invalid
      REPORT_RECIPIENTS: test@test.invalid
      TESTING: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intellibox_test
          POSTGRES_USER: intellibox_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U intellibox_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Run PostgreSQL stress tests
        env:
          PG_TEST_DATABASE_URL: postgresql+psycopg://intellibox_test:test_password@localhost:5434/intellibox_test
          PG_STRESS_DATABASE_URL: postgresql+psycopg://intellibox_test:test_password@localhost:5434/intellibox_test
        run: python run_pg_tests.py --stress

  deploy:
    needs: [lint, test, container, test-postgres]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.PILOT_SSH_KEY }}" ] || [ -z "${{ secrets.PILOT_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: PILOT_SSH_KEY or PILOT_HOST secret not configured"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PILOT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.PILOT_HOST }}
          IRONBANK_USER: ${{ secrets.IRONBANK_USER }}
          IRONBANK_PASSWORD: ${{ secrets.IRONBANK_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i ~/.ssh/deploy_key \
              "ubuntu@${SSH_HOST}" \
              "export IRONBANK_USER='${IRONBANK_USER}'; export IRONBANK_PASSWORD='${IRONBANK_PASSWORD}'; bash -s" << 'DEPLOY_SCRIPT'
          set -euo pipefail

          echo "=== Quick deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

          cd /home/ubuntu/INtelliBOX
          git fetch origin main
          git reset --hard origin/main
          echo "HEAD: $(git rev-parse --short HEAD) — $(git log -1 --format='%s')"

          ENV_FILE=/home/ubuntu/INtelliBOX/deploy/.env.production

          # Strip Windows line endings from .env.production
          sudo sed -i 's/\r$//' "$ENV_FILE"

          # Detect database backend
          DATABASE_URL=$(grep '^DATABASE_URL=' "$ENV_FILE" | cut -d'=' -f2-)
          USE_PG=false
          if echo "$DATABASE_URL" | grep -q "^postgresql"; then
              USE_PG=true
          fi
          echo "Database mode: $(if $USE_PG; then echo PostgreSQL; else echo SQLite; fi)"

          # Stop systemd services and disable to prevent auto-restart
          sudo systemctl disable --now pod-intellibox-pod.service 2>/dev/null || true
          sudo systemctl disable --now intellibox.service 2>/dev/null || true

          # Stop and remove all intellibox containers and pods
          sudo podman pod stop intellibox-pod 2>/dev/null || true
          sudo podman pod rm intellibox-pod 2>/dev/null || true
          sudo podman stop -a --time 10 2>/dev/null || true
          sudo podman rm -af 2>/dev/null || true

          # Ensure port 8000 is free
          sudo fuser -k 8000/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -tlnp | grep -q ':8000 '; then
              echo "ERROR: Port 8000 still in use after cleanup!"
              sudo ss -tlnp | grep ':8000 '
              exit 1
          fi
          echo "Port 8000 confirmed free."

          echo "=== Logging in to IronBank registry ==="
          echo "$IRONBANK_PASSWORD" | sudo podman login registry1.dso.mil -u "$IRONBANK_USER" --password-stdin

          echo "=== Building container image ==="
          sudo podman build -t intellibox:prod -f Dockerfile .

          if $USE_PG; then
              echo "=== Starting PostgreSQL + INtelliBOX (Podman pod) ==="

              POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' "$ENV_FILE" | cut -d'=' -f2)
              mkdir -p /opt/intellibox/pgdata

              sudo podman pod create --name intellibox-pod -p 127.0.0.1:8000:8000

              sudo podman run -d \
                  --name intellibox-db \
                  --pod intellibox-pod \
                  --restart=always \
                  -e POSTGRES_DB=intellibox \
                  -e POSTGRES_USER=intellibox \
                  -e "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
                  -v /opt/intellibox/pgdata:/var/lib/postgresql/data:Z \
                  docker.io/library/postgres:16-alpine

              echo "Waiting for PostgreSQL..."
              for i in $(seq 1 30); do
                  if sudo podman exec intellibox-db pg_isready -U intellibox -q 2>/dev/null; then
                      echo "PostgreSQL ready after ${i}s"
                      break
                  fi
                  if [ "$i" -eq 30 ]; then
                      echo "ERROR: PostgreSQL did not start within 30s"
                      sudo podman logs intellibox-db
                      exit 1
                  fi
                  sleep 1
              done

              sudo podman run -d \
                  --name intellibox \
                  --pod intellibox-pod \
                  --restart=always \
                  --env-file "$ENV_FILE" \
                  -v /opt/intellibox/data:/app/data:Z \
                  intellibox:prod
          else
              echo "=== Starting INtelliBOX (SQLite) ==="

              sudo podman run -d \
                  --name intellibox \
                  --restart=always \
                  --env-file "$ENV_FILE" \
                  -v /opt/intellibox/data:/app/data:Z \
                  -p 127.0.0.1:8000:8000 \
                  intellibox:prod
          fi

          echo "=== Waiting for health check ==="
          for i in $(seq 1 60); do
              if curl -sf --max-time 3 http://127.0.0.1:8000/health; then
                  echo ""
                  echo "Healthy after ${i}s"
                  curl -s http://127.0.0.1:8000/health
                  echo ""
                  if $USE_PG; then
                      sudo podman generate systemd --name intellibox-pod --new --files
                      sudo mv pod-intellibox-pod.service container-intellibox.service container-intellibox-db.service /etc/systemd/system/ 2>/dev/null || true
                      sudo systemctl daemon-reload
                      sudo systemctl enable pod-intellibox-pod.service
                  else
                      sudo podman generate systemd --name intellibox --new | sudo tee /etc/systemd/system/intellibox.service > /dev/null
                      sudo systemctl daemon-reload
                      sudo systemctl enable intellibox.service
                  fi
                  exit 0
              fi
              sleep 1
          done
          echo "Health check failed after 60s"
          sudo podman logs --tail 30 intellibox
          exit 1
          DEPLOY_SCRIPT

      - name: Verify external endpoint
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.PILOT_HOST }}
        run: |
          sleep 5
          curl -sf --max-time 10 "https://${SSH_HOST}/health" && echo "External check passed" || echo "::warning::External check failed — verify manually"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
