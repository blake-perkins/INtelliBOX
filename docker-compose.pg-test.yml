version: '3.8'

# PostgreSQL test instances for running the PG test suite locally.
# Usage: docker compose -f docker-compose.pg-test.yml up -d

services:
  # Functional/integration tests — tmpfs for speed
  postgres-test:
    image: postgres:16-alpine
    container_name: intellibox-pg-test
    environment:
      POSTGRES_DB: intellibox_test
      POSTGRES_USER: intellibox_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellibox_test"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Stress tests — higher connection limit, separate instance
  postgres-stress:
    image: postgres:16-alpine
    container_name: intellibox-pg-stress
    environment:
      POSTGRES_DB: intellibox_stress
      POSTGRES_USER: intellibox_stress
      POSTGRES_PASSWORD: stress_password
    ports:
      - "5434:5432"
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c log_statement=none
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellibox_stress"]
      interval: 2s
      timeout: 3s
      retries: 10
    profiles:
      - stress
